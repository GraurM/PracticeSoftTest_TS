name: Load Tests (k6)

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Optional base URL override (defaults to config/test-config.json)'
        required: false
        default: ''
        type: string

jobs:
  load-tests:
    name: Run k6 Load Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: ⚡ Setup k6
        uses: grafana/setup-k6-action@v1

      - name: 🌐 Resolve BASE_URL
        id: resolve_base_url
        shell: bash
        run: |
          INPUT_BASE_URL="${{ github.event.inputs.base_url }}"
          if [ -n "$INPUT_BASE_URL" ]; then
            BASE_URL="$INPUT_BASE_URL"
          else
            BASE_URL=$(node -e "const fs=require('node:fs');const c=JSON.parse(fs.readFileSync('config/test-config.json','utf8'));const v=String(c.BASE_URL||'').trim();if(!v){process.exit(1)};process.stdout.write(v)") || {
              echo "BASE_URL not found in config/test-config.json"
              exit 1
            }
          fi
          echo "base_url=$BASE_URL" >> "$GITHUB_OUTPUT"
          echo "Resolved BASE_URL=$BASE_URL"

      - name: 🧹 Clean report folders
        run: rm -rf allure-results allure-report k6-results logs

      - name: 🧪 Run k6 Performance Tests
        id: k6
        continue-on-error: true
        run: |
          mkdir -p logs k6-results
          npm run test:perf:ci
        env:
          BASE_URL: ${{ steps.resolve_base_url.outputs.base_url }}
          CI: true

      - name: 📊 Generate Single-File Allure Report
        if: always()
        run: npm run allure:generate:single

      - name: 📝 Load execution summary
        if: always()
        run: |
          echo "k6 step outcome: ${{ steps.k6.outcome }}"

      - name: 📤 Upload Load Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-tests-report
          path: |
            allure-results/
            allure-report/index.html
            k6-results/
            logs/
          retention-days: 30
          if-no-files-found: error
